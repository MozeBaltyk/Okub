apiVersion: okub.io/v1alpha1
kind: Cluster

metadata:
  name: ha-lab

cluster:
  baseDomain: example.test
  version: "4.20"
  architecture: x86_64
  topology: ha

# Bare-metal platform publishes both VIPs to openshift-install.
platform:
  type: baremetal

network:
  machineCIDR: 192.168.103.0/24
  clusterCIDR: 10.128.0.0/14
  hostPrefix: 23
  serviceCIDR: 172.30.0.0/16
  dnsServers:
    - 192.168.103.1
  gateway: 192.168.103.1
  apiVIP: 192.168.103.10
  ingressVIP: 192.168.103.11
  rendezvousIP: 192.168.103.20

# Input order is intentionally mixed; rendered hosts are ordered by name.
hosts:
  - name: worker-1
    role: worker
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:03:31"
    address: 192.168.103.31/24
    installationDisk: /dev/sde
  - name: master-2
    role: master
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:03:22"
    address: 192.168.103.22/24
    installationDisk: /dev/sdc
  - name: master-0
    role: master
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:03:20"
    address: 192.168.103.20/24
    installationDisk: /dev/sda
  - name: worker-0
    role: worker
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:03:30"
    address: 192.168.103.30/24
    installationDisk: /dev/sdd
  - name: master-1
    role: master
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:03:21"
    address: 192.168.103.21/24
    installationDisk: /dev/sdb

boot:
  method: pxe
  artifactsBaseURL: http://192.168.103.5:8080/artifacts/pxe

artifacts:
  outputDirectory: ./.local/build/ha-lab
  cacheDirectory: ./.local/cache
  checksumPolicy: required

credentials:
  pullSecretFile: ~/.config/okub/pull-secret.json
  sshPublicKeyFile: ~/.ssh/id_ed25519.pub

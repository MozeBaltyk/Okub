apiVersion: okub.io/v1alpha1
kind: Cluster

metadata:
  name: lab

cluster:
  baseDomain: example.test
  version: "4.20"
  architecture: x86_64
  topology: sno

platform:
  type: none

network:
  machineCIDR: 192.168.101.0/24
  clusterCIDR: 10.128.0.0/14
  hostPrefix: 23
  serviceCIDR: 172.30.0.0/16
  dnsServers:
    - 192.168.101.1
  gateway: 192.168.101.1
  apiVIP: 192.168.101.10
  ingressVIP: 192.168.101.11
  rendezvousIP: 192.168.101.20

hosts:
  - name: master-0
    role: master
    interfaces:
      - name: eno1
        macAddress: "52:54:00:00:00:10"
    address: 192.168.101.20/24
    installationDisk: /dev/vda

boot:
  method: iso

# Optional unattended Fedora Cloud 44 network-services helper. LAN gateway and
# DNS are the first usable machineCIDR address; the host bridge reserves .254.
helper:
  fedoraRelease: 44
  vmName: okub-lab-helper
  storagePool: images
  wanCIDR: 172.31.255.0/24
  wanMAC: "02:00:00:00:10:01"
  lanMAC: "02:00:00:00:10:02"
  vcpu: 2
  memoryMiB: 2048
  rootDiskSizeGiB: 20

credentials:
  # For catalog-free testing, this file may contain the fake pull secret
  # documented in the README. Use a real pull secret when catalog access is needed.
  pullSecretFile: ~/.config/okub/pull-secret.json
  sshPublicKeyFile: ~/.ssh/ed25519.pub

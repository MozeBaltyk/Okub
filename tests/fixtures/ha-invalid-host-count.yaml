apiVersion: okub.io/v1alpha1
kind: Cluster
metadata: {name: ha-invalid}
cluster: {baseDomain: example.test, version: "4.20", architecture: x86_64, topology: ha}
platform: {type: baremetal}
network:
  {machineCIDR: 192.168.103.0/24, clusterCIDR: 10.128.0.0/14, hostPrefix: 23, serviceCIDR: 172.30.0.0/16, dnsServers: [192.168.103.1], gateway: 192.168.103.1, apiVIP: 192.168.103.10, ingressVIP: 192.168.103.11}
hosts:
  - {name: master-0, role: master, interfaces: [{name: eno1, macAddress: "52:54:00:00:03:20"}], address: 192.168.103.20/24, installationDisk: /dev/sda}
  - {name: master-1, role: master, interfaces: [{name: eno1, macAddress: "52:54:00:00:03:21"}], address: 192.168.103.21/24, installationDisk: /dev/sdb}
  - {name: master-2, role: master, interfaces: [{name: eno1, macAddress: "52:54:00:00:03:22"}], address: 192.168.103.22/24, installationDisk: /dev/sdc}
  - {name: worker-0, role: worker, interfaces: [{name: eno1, macAddress: "52:54:00:00:03:30"}], address: 192.168.103.30/24, installationDisk: /dev/sdd}
boot: {method: iso}
credentials: {pullSecretFile: ~/.config/okub/pull-secret.json, sshPublicKeyFile: ~/.ssh/id_ed25519.pub}

apiVersion: v1
baseDomain: example.test
compute:
    - architecture: amd64
      hyperthreading: Enabled
      name: worker
      replicas: 0
controlPlane:
    architecture: amd64
    hyperthreading: Enabled
    name: master
    replicas: 1
metadata:
    name: lab
networking:
    clusterNetwork:
        - cidr: 10.128.0.0/14
          hostPrefix: 23
    machineNetwork:
        - cidr: 192.168.101.0/24
    networkType: OVNKubernetes
    serviceNetwork:
        - 172.30.0.0/16
platform:
    none: {}
pullSecret: '{"auths":{}}'
sshKey: ssh-ed25519 AAAATEST okub-test
